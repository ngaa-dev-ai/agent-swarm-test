name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, skipping"
          fi

      - name: Lint
        run: |
          if [ -f package.json ] && npm run lint --if-present 2>/dev/null; then
            echo "Lint passed"
          else
            echo "No lint script or no package.json, skipping"
          fi

      - name: Test
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test
          else
            echo "No test script or no package.json, skipping"
          fi

      - name: Build
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
            npm run build
          else
            echo "No build script or no package.json, skipping"
          fi
